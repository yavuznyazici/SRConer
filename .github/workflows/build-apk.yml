
name: Build SRConer APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android files
        run: flutter create --platforms=android --org com.srconer --project-name srconer .

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="SRConer"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SRConer-APK
          path: build/app/outputs/flutter-apk/app-release.apk
